# Bridge the verified Codebase Memory runtime into DSH as native MCP tools
# and register the file-system watcher that keeps the graph fresh.
- insert:
    - id: mcp-codebase-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codebase_memory
        transport: stdio
        command: !!js >-
          process.env.APPDATA +
          "/npm/node_modules/codebase-memory-mcp/bin/codebase-memory-mcp.exe"
        cwd: !!js >-
          process.env.TEMP + "/dsh-codebase-memory-session"
        args: []
        toolCallTimeoutMs: 600000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    # Watcher: same package, different bundle id so its setup() runs as a
    # standalone plugin without competing with the MCP-client bridge above.
    - id: dsh-codebase-memory-watcher
      name: dsh-codebase-memory
      config:
        enabled: true
        autoAttach: true
        defaultDebounceMs: 5000
        defaultMode: moderate
        usePolling: false
        ignored:
          - "**/node_modules/**"
          - "**/.git/**"
          - "**/dist/**"
          - "**/build/**"
          - "**/.next/**"
          - "**/.turbo/**"
          - "**/.codebase-memory/**"
          - "**/.pnpm-store/**"
          - "**/target/**"
          - "**/__pycache__/**"
          - "**/.venv/**"
        watchedExtensions:
          - .ts
          - .tsx
          - .js
          - .jsx
          - .mjs
          - .cjs
          - .py
          - .go
          - .rs
          - .java
          - .cs
          - .rb
          - .php
          - .vue
          - .svelte
