# Bridge the verified Codebase Memory runtime into DSH as native MCP tools
# and register the file-system watcher that keeps the graph fresh.
- insert:
    - id: mcp-codebase-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codebase_memory
        transport: stdio
# Cross-platform resolution (review fix): Windows cannot spawn "npx" directly without
# a shell, so invoke npm's npx-cli.js with the Node executable itself; on other
# platforms resolve npx from PATH. npx -y fetches codebase-memory-mcp on first use,
# so no pre-installed global CLI is required anywhere.
        command: !!js >-
          process.platform === "win32" ? process.execPath : "npx"
        args: !!js >-
          process.platform === "win32"
            ? [process.execPath.replace(/\\node\.exe$/, "") + "\\node_modules\\npm\\bin\\npx-cli.js", "-y", "codebase-memory-mcp@0.10.8"]
            : ["-y", "codebase-memory-mcp@0.10.8"]
        cwd: !!js >-
          (process.env.TEMP || process.env.TMPDIR || "/tmp") + "/dsh-codebase-memory-session"
        toolCallTimeoutMs: 600000
# Keep the Host booting even when npx/npm is missing; the watcher still works and the
# startup error is logged instead of killing plugin load.
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    # Watcher: same package, different bundle id so its setup() runs as a
    # standalone plugin without competing with the MCP-client bridge above.
    - id: dsh-codebase-memory-watcher
      name: dsh-codebase-memory
      config:
        enabled: true
        autoAttach: true
        defaultDebounceMs: 5000
        defaultMode: moderate
        usePolling: false
        ignored:
          - "**/node_modules/**"
          - "**/.git/**"
          - "**/dist/**"
          - "**/build/**"
          - "**/.next/**"
          - "**/.turbo/**"
          - "**/.codebase-memory/**"
          - "**/.pnpm-store/**"
          - "**/target/**"
          - "**/__pycache__/**"
          - "**/.venv/**"
        watchedExtensions:
          - .ts
          - .tsx
          - .js
          - .jsx
          - .mjs
          - .cjs
          - .py
          - .go
          - .rs
          - .java
          - .cs
          - .rb
          - .php
          - .vue
          - .svelte
